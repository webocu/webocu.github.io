name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: the release assets are still the files the catalog describes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Catalog is valid and up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make check

  verify:
    name: Release assets match the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make verify
